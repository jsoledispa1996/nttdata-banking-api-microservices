server:
  port: 8080

spring:
  config:
    activate:
      on-profile: dev

# Logging for development
logging:
  level:
    root: INFO
    com.nttdata.banking.auth: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# JWT Configuration (development)
jwt:
  secret: nttdata-banking-microservices-secret-key-2024-super-secure-min-256-bits-hmac-sha256
  expiration: 300 # 5 minutes
