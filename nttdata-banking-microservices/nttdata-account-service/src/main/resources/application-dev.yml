spring:
  r2dbc:
    url: r2dbc:mysql://localhost:3308/accountdb?useSSL=false
    username: banking_user
    password: banking_pass
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 30m
      validation-query: SELECT 1

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: account-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "CustomerCreatedEvent:com.nttdata.banking.shared.events.CustomerCreatedEvent,CustomerUpdatedEvent:com.nttdata.banking.shared.events.CustomerUpdatedEvent,CustomerDeletedEvent:com.nttdata.banking.shared.events.CustomerDeletedEvent"

server:
  port: 8082

logging:
  level:
    com.nttdata.banking: DEBUG
    org.springframework.r2dbc: DEBUG
    io.r2dbc.mysql: DEBUG
    org.springframework.kafka: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

# Kafka Topics
kafka:
  topics:
    customer-events: customer-events
