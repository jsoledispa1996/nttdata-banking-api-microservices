# Test Configuration for Account Service
spring.application.name=nttdata-account-service-test

# R2DBC MySQL (will be overridden by Testcontainers)
spring.r2dbc.url=r2dbc:mysql://localhost:3306/testdb
spring.r2dbc.username=testuser
spring.r2dbc.password=testpass

# Initialize database schema
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=10

# Disable SQL initialization by Spring (Testcontainers handles it)
spring.sql.init.mode=never

# Kafka (will be overridden by Testcontainers)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Logging
logging.level.com.nttdata.banking=DEBUG
logging.level.org.springframework.r2dbc=DEBUG

# Security - Disable for tests
spring.security.enabled=false

# JWT Configuration (if needed for integration tests)
jwt.secret=test-secret-key-for-integration-tests-minimum-256-bits-required
jwt.expiration=300000
